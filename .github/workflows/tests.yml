name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # No credentials needed: the fast suite uses fakes for the
        # LLM/retriever/reranker (see tests/conftest.py) rather than
        # real API calls or model downloads. Verified locally with all
        # relevant env vars cleared before adding this workflow.
        run: pytest tests/ -v
